name: Backend CI

# Runs on every PR/push to main, unconditionally -- this workflow is one of
# the two required status checks for the branch protection rule on `main`
# (see backend/.claude/skills/deployment-infra for the rest of the pipeline
# this gates: Vercel/Railway auto-deploy on push to main is untouched by
# this workflow, it only runs *before* a PR is allowed to merge).
#
# Deliberately NOT path-filtered (no `paths: backend/**`): a required status
# check that's also path-filtered never reports on a PR that doesn't touch
# that path, and GitHub then waits forever for a check that will never
# arrive -- permanently blocking merge unless someone remembers to bypass
# rules. The job itself is a few seconds either way, so always running it
# costs little and avoids that trap entirely.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (incl. dev group)
        run: uv sync --group dev

      # Deliberately NOT running the FastAPI app or importing app.agents here:
      # agents.py fetches prompts from Langfuse at import time in Strict Mode
      # (no fallback -- see the observability-langfuse skill) and needs a
      # real GOOGLE_API_KEY + Langfuse credentials. Lint + the schema-only
      # test suite below don't need any of that.
      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Test (pytest)
        run: uv run pytest tests/ -v
